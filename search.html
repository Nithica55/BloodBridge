<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find Donor - BloodBridge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🩸 BloodBridge</h1>
    <p>Find a potential blood donor</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="register.html">Become a Donor</a>
    <a href="search.html">Find Donor</a>
    <a href="request.html">Emergency Request</a>
    <a href="matching.html">Smart Matching</a>
    <a href="dashboard.html">Dashboard</a>
</nav>


<section class="form-section">

    <h2>🔎 Find a Donor</h2>

    <label>Blood Group</label>

    <select id="bloodGroup">

        <option value="">Select Blood Group</option>

        <option value="A+">A+</option>
        <option value="A-">A-</option>

        <option value="B+">B+</option>
        <option value="B-">B-</option>

        <option value="O+">O+</option>
        <option value="O-">O-</option>

        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>

    </select>


    <label>State</label>

    <select id="state">

        <option value="">Select State</option>

        <option value="Tamil Nadu">Tamil Nadu</option>
        <option value="Kerala">Kerala</option>
        <option value="Karnataka">Karnataka</option>
        <option value="Andhra Pradesh">Andhra Pradesh</option>
        <option value="Telangana">Telangana</option>
        <option value="Maharashtra">Maharashtra</option>
        <option value="Delhi">Delhi</option>
        <option value="Gujarat">Gujarat</option>
        <option value="Rajasthan">Rajasthan</option>
        <option value="West Bengal">West Bengal</option>

    </select>


    <label>City</label>

    <select id="city">

        <option value="">Select City</option>

    </select>


    <button onclick="searchDonor()">
        🔎 SEARCH DONOR
    </button>

</section>


<section>

    <h2>🩸 Results</h2>

    <div id="results">

        <div class="card">
            <p>
                Select your requirements and search.
            </p>
        </div>

    </div>

</section>


<footer>

    <p>© 2026 BloodBridge</p>

</footer>


<script>

/* ==============================
   CITY LIST
============================== */

const cityData = {

    "Tamil Nadu": [
        "Chennai",
        "Coimbatore",
        "Madurai",
        "Salem",
        "Tirunelveli",
        "Nagercoil",
        "Tiruppur",
        "Erode",
        "Thoothukudi",
        "Kanyakumari"
    ],

    "Kerala": [
        "Thiruvananthapuram",
        "Kochi",
        "Kozhikode",
        "Kollam",
        "Thrissur"
    ],

    "Karnataka": [
        "Bengaluru",
        "Mysuru",
        "Mangaluru",
        "Hubballi"
    ],

    "Andhra Pradesh": [
        "Visakhapatnam",
        "Vijayawada",
        "Guntur",
        "Tirupati"
    ],

    "Telangana": [
        "Hyderabad",
        "Warangal",
        "Nizamabad"
    ],

    "Maharashtra": [
        "Mumbai",
        "Pune",
        "Nagpur",
        "Nashik"
    ],

    "Delhi": [
        "New Delhi"
    ],

    "Gujarat": [
        "Ahmedabad",
        "Surat",
        "Vadodara"
    ],

    "Rajasthan": [
        "Jaipur",
        "Jodhpur",
        "Udaipur"
    ],

    "West Bengal": [
        "Kolkata",
        "Howrah",
        "Siliguri"
    ]

};


/* ==============================
   STATE → CITY
============================== */

document.getElementById("state").addEventListener(
    "change",
    function () {

        const city =
            document.getElementById("city");

        city.innerHTML =
            '<option value="">Select City</option>';

        const selectedState =
            this.value;

        if (cityData[selectedState]) {

            cityData[selectedState].forEach(
                function (name) {

                    const option =
                        document.createElement("option");

                    option.value = name;
                    option.textContent = name;

                    city.appendChild(option);

                }
            );

        }

    }
);


/* ==============================
   SEARCH
============================== */

function searchDonor() {

    const bloodGroup =
        document.getElementById("bloodGroup").value;

    const state =
        document.getElementById("state").value;

    const city =
        document.getElementById("city").value;


    /* FIRST TEST */

    alert("🔎 Searching for donor...");


    /* CHECK SELECTION */

    if (
        bloodGroup === "" ||
        state === "" ||
        city === ""
    ) {

        alert(
            "⚠️ Please select Blood Group, State and City."
        );

        return;

    }


    /* GET SAVED DONORS */

    const donors =
        JSON.parse(
            localStorage.getItem("bloodbridgeDonors")
        ) || [];


    /* FIND MATCH */

    const matches =
        donors.filter(function(donor) {

            return (
                donor.bloodGroup === bloodGroup &&
                donor.state === state &&
                donor.city === city &&
                donor.availability === "Available"
            );

        });


    /* RESULTS */

    const results =
        document.getElementById("results");

    results.innerHTML = "";


    /* ==============================
       MATCH FOUND
    ============================== */

    if (matches.length > 0) {

        alert(
            "🩸 MATCH FOUND!\n\n" +
            matches.length +
            " available donor(s) found!"
        );


        matches.forEach(function(donor) {

            results.innerHTML += `

                <div class="card">

                    <h3>
                        🩸 ${donor.name}
                    </h3>

                    <p>
                        <strong>Blood Group:</strong>
                        ${donor.bloodGroup}
                    </p>

                    <p>
                        <strong>Location:</strong>
                        ${donor.city},
                        ${donor.state}
                    </p>

                    <p>
                        <strong>Area:</strong>
                        ${donor.area}
                    </p>

                    <p>
                        <strong>Availability:</strong>
                        🟢 Available
                    </p>

                    <button
                        onclick="requestContact('${donor.name}')">

                        📩 Request Contact

                    </button>

                </div>

            `;

        });

    }


    /* ==============================
       NO MATCH
    ============================== */

    else {

        alert(
            "❌ NO MATCH FOUND\n\n" +
            "No available donor matches your selection."
        );


        results.innerHTML = `

            <div class="card">

                <h3>
                    ❌ No Available Donor
                </h3>

                <p>
                    No available donor matches:
                </p>

                <p>
                    🩸 Blood Group:
                    ${bloodGroup}
                </p>

                <p>
                    📍 Location:
                    ${city}, ${state}
                </p>

                <a
                    href="request.html"
                    class="button">

                    🚨 Send Emergency Request

                </a>

            </div>

        `;

    }

}


/* ==============================
   CONTACT
============================== */

function requestContact(name) {

    alert(
        "📩 Contact request sent for " +
        name
    );

}

</script>

</body>
    </html>
