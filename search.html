<!DOCTYPE html>
<html>
<head>
    <title>Find Donor - BloodBridge</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🩸 BloodBridge</h1>
    <p>Find a Potential Blood Donor</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="register.html">Become a Donor</a>
    <a href="search.html">Find Donor</a>
    <a href="request.html">Emergency Request</a>
</nav>

<section class="form-section">

    <h2>Find a Donor</h2>

    <form>

        <label>Blood Group</label>

        <select>
            <option>Select Blood Group</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>O+</option>
            <option>O-</option>
            <option>AB+</option>
            <option>AB-</option>
        </select>

        <label>Location</label>

        <input
            type="text"
            placeholder="Enter city or area">

        <button type="submit">
            Search Donors
        </button>

    </form>

</section>

</body>
</html>
