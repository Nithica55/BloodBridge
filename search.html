<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BloodBridge | Find Donor</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<header>

    <h1>🩸 BloodBridge</h1>

    <p>
        Find Potential Blood Donors
    </p>

</header>


<nav>

    <a href="index.html">Home</a>

    <a href="register.html">Become a Donor</a>

    <a href="search.html">Find Donor</a>

    <a href="request.html">Emergency Request</a>

    <a href="matching.html">Smart Matching</a>

    <a href="dashboard.html">Dashboard</a>

</nav>


<section>

    <div class="form-section">

        <h2>
            🔎 Search for a Donor
        </h2>


        <label>
            Blood Group
        </label>

        <select id="bloodGroup">

            <option value="">
                -- Select Blood Group --
            </option>

            <option value="A+">A+</option>
            <option value="A-">A-</option>

            <option value="B+">B+</option>
            <option value="B-">B-</option>

            <option value="O+">O+</option>
            <option value="O-">O-</option>

            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>

        </select>


        <label>
            State
        </label>

        <select id="state">

            <option value="">
                -- Select State --
            </option>

        </select>


        <label>
            City
        </label>

        <select id="city">

            <option value="">
                -- Select City --
            </option>

        </select>


        <button onclick="searchDonors()">
            🔎 Search Available Donors
        </button>

    </div>

</section>


<section>

    <h2>
        🩸 Search Results
    </h2>

    <div id="results">

        <div class="card">

            <p>
                Enter your requirements above
                to search for potential donors.
            </p>

        </div>

    </div>

</section>


<footer>

    <p>
        © 2026 BloodBridge
    </p>

    <p>
        Healthcare Technology Prototype
    </p>

</footer>


<script>


/* ==============================
   GET DONOR DATA
============================== */

const donors =
    JSON.parse(
        localStorage.getItem(
            "bloodbridgeDonors"
        )
    ) || [];



/* ==============================
   STATES
============================== */

const states = [
    "Andhra Pradesh",
    "Arunachal Pradesh",
    "Assam",
    "Bihar",
    "Chhattisgarh",
    "Goa",
    "Gujarat",
    "Haryana",
    "Himachal Pradesh",
    "Jharkhand",
    "Karnataka",
    "Kerala",
    "Madhya Pradesh",
    "Maharashtra",
    "Manipur",
    "Meghalaya",
    "Mizoram",
    "Nagaland",
    "Odisha",
    "Punjab",
    "Rajasthan",
    "Sikkim",
    "Tamil Nadu",
    "Telangana",
    "Tripura",
    "Uttar Pradesh",
    "Uttarakhand",
    "West Bengal",
    "Andaman and Nicobar Islands",
    "Chandigarh",
    "Dadra and Nagar Haveli and Daman and Diu",
    "Delhi",
    "Jammu and Kashmir",
    "Ladakh",
    "Lakshadweep",
    "Puducherry"
];


const stateSelect =
    document.getElementById("state");


const citySelect =
    document.getElementById("city");


states.forEach(state => {

    const option =
        document.createElement("option");

    option.value = state;

    option.textContent = state;

    stateSelect.appendChild(option);

});



/* ==============================
   CITY LIST
============================== */

const cities = {

    "Tamil Nadu": [
        "Chennai",
        "Coimbatore",
        "Madurai",
        "Tiruchirappalli",
        "Salem",
        "Tirunelveli",
        "Nagercoil",
        "Thoothukudi",
        "Erode",
        "Tiruppur",
        "Vellore",
        "Dindigul",
        "Thanjavur",
        "Kanyakumari"
    ],

    "Kerala": [
        "Thiruvananthapuram",
        "Kochi",
        "Kozhikode",
        "Kollam",
        "Thrissur",
        "Kannur"
    ],

    "Karnataka": [
        "Bengaluru",
        "Mysuru",
        "Mangaluru",
        "Hubballi",
        "Belagavi",
        "Udupi"
    ],

    "Andhra Pradesh": [
        "Visakhapatnam",
        "Vijayawada",
        "Guntur",
        "Tirupati",
        "Nellore",
        "Kurnool"
    ],

    "Telangana": [
        "Hyderabad",
        "Warangal",
        "Nizamabad",
        "Karimnagar",
        "Khammam"
    ],

    "Maharashtra": [
        "Mumbai",
        "Pune",
        "Nagpur",
        "Nashik",
        "Thane"
    ],

    "Gujarat": [
        "Ahmedabad",
        "Surat",
        "Vadodara",
        "Rajkot",
        "Gandhinagar"
    ],

    "Delhi": [
        "Delhi",
        "New Delhi"
    ],

    "West Bengal": [
        "Kolkata",
        "Howrah",
        "Durgapur",
        "Siliguri"
    ],

    "Uttar Pradesh": [
        "Lucknow",
        "Kanpur",
        "Agra",
        "Varanasi",
        "Noida",
        "Ghaziabad"
    ]

};



/* ==============================
   STATE → CITY
============================== */

stateSelect.addEventListener(
    "change",
    function () {

        citySelect.innerHTML = `
            <option value="">
                -- Select City --
            </option>
        `;

        const selectedState =
            this.value;

        if (
            cities[selectedState]
        ) {

            cities[selectedState]
                .forEach(city => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value = city;

                    option.textContent = city;

                    citySelect.appendChild(
                        option
                    );

                });

        }

    }
);



/* ==============================
   SEARCH DONORS
============================== */

function searchDonors() {

    const bloodGroup =
        document.getElementById(
            "bloodGroup"
        ).value;

    const state =
        document.getElementById(
            "state"
        ).value;

    const city =
        document.getElementById(
            "city"
        ).value;


    if (
        bloodGroup === "" ||
        state === "" ||
        city === ""
    ) {

        alert(
            "⚠️ Please select blood group, state and city."
        );

        return;

    }


    const matches =
        donors.filter(donor =>

            donor.bloodGroup ===
            bloodGroup &&

            donor.state ===
            state &&

            donor.city ===
            city &&

            donor.availability ===
            "Available"

        );



    /* ==============================
       MATCH FOUND
    ============================== */

    if (
        matches.length > 0
    ) {

        alert(
            "🩸 MATCH FOUND!\n\n" +
            matches.length +
            " available potential donor(s) " +
            "with " +
            bloodGroup +
            " found in " +
            city +
            "."
        );

    }


    /* ==============================
       DISPLAY RESULTS
    ============================== */

    const results =
        document.getElementById(
            "results"
        );

    results.innerHTML = "";



    if (
        matches.length === 0
    ) {

        results.innerHTML = `

            <div class="card">

                <h3>
                    ❌ No Available Match
                </h3>

                <p>
                    No available potential donor
                    was found for the selected
                    blood group and location.
                </p>

                <p>
                    Try another location or
                    submit an emergency request.
                </p>

            </div>

        `;

        return;

    }



    matches.forEach(donor => {

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "card";


        card.innerHTML = `

            <h3>
                🩸 ${donor.name}
            </h3>

            <p>
                <strong>
                    Blood Group:
                </strong>

                ${donor.bloodGroup}
            </p>

            <p>
                <strong>
                    Location:
                </strong>

                ${donor.city},
                ${donor.state}
            </p>

            <p>
                <strong>
                    Area:
                </strong>

                ${donor.area}
            </p>

            <p>
                <strong>
                    Availability:
                </strong>

                🟢 Available
            </p>

            <button
                onclick="requestContact('${donor.name}')">

                📩 Request Contact

            </button>

        `;


        results.appendChild(
            card
        );

    });

}



/* ==============================
   CONTACT REQUEST
============================== */

function requestContact(
    name
) {

    alert(
        "📩 Contact request created for " +
        name +
        ". Further verification is required."
    );

}

</script>


</body>

    </html>
