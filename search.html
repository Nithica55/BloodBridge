
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BloodBridge | Find Donors</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f5f6fa;color:#293044}
header{background:#a50025;color:white;padding:18px 6%;display:flex;justify-content:space-between;align-items:center}
button{cursor:pointer;border:0;border-radius:7px;padding:11px 16px;font-weight:bold}
.language{background:white;color:#a50025}
nav{background:white;padding:15px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
nav a{color:#a50025;text-decoration:none;font-weight:bold}
main{max-width:850px;margin:35px auto;padding:0 16px}
.panel{background:white;padding:25px;border-radius:13px;box-shadow:0 4px 18px #0000000c}
h1{color:#a50025;margin-bottom:12px}
.description{color:#737b8c;line-height:1.6;margin-bottom:22px}
label{display:block;font-weight:bold;margin:15px 0 7px}
input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:7px;background:white}
.search-btn{background:#a50025;color:white;width:100%;margin-top:22px;padding:14px}
.results{margin-top:25px}
.donor-card{background:white;border:1px solid #eee;border-left:5px solid #b0002c;padding:20px;border-radius:10px;margin-bottom:15px}
.donor-card h3{color:#a50025;margin-bottom:10px}
.detail{margin-top:10px;color:#4c566a;overflow-wrap:anywhere}
.available{color:#16834a;font-weight:bold}
.contact{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.contact a{background:#a50025;color:white;text-decoration:none;padding:10px 14px;border-radius:7px;font-size:14px}
.empty{background:#fff0f3;padding:18px;border-radius:8px;color:#a50025;line-height:1.6}
.note{background:#fff8e9;padding:15px;margin-top:20px;border-radius:8px;font-size:13px;line-height:1.6;color:#66552e}
footer{text-align:center;padding:25px;color:#777;font-size:13px}
</style>
</head>

<body>

<header>
<h2>🩸 BloodBridge</h2>
<button class="language" onclick="toggleLanguage()" id="languageButton">தமிழ்</button>
</header>

<nav>
<a href="index.html" data-en="Home" data-ta="முகப்பு">Home</a>
<a href="register.html" data-en="Register" data-ta="பதிவு">Register</a>
<a href="search.html" data-en="Find Donor" data-ta="நன்கொடையாளர் தேடல்">Find Donor</a>
<a href="request.html" data-en="Emergency Request" data-ta="அவசர கோரிக்கை">Emergency Request</a>
<a href="dashboard.html" data-en="Dashboard" data-ta="புள்ளிவிவரங்கள்">Dashboard</a>
<a href="admin.html" data-en="Admin Panel" data-ta="நிர்வாகப் பலகை">Admin Panel</a>
</nav>

<main>
<div class="panel">

<h1 data-en="Find Blood Donors" data-ta="இரத்த நன்கொடையாளர்களைக் கண்டறியவும்">Find Blood Donors</h1>

<p class="description"
data-en="Search potential donors by blood group, state and city."
data-ta="இரத்த வகை, மாநிலம் மற்றும் நகரத்தின் அடிப்படையில் நன்கொடையாளர்களைத் தேடுங்கள்.">
Search potential donors by blood group, state and city.
</p>

<form id="searchForm">

<label data-en="Blood Group" data-ta="இரத்த வகை">Blood Group</label>
<select id="bloodGroup" required>
<option value="">Select Blood Group</option>
<option>A+</option><option>A-</option>
<option>B+</option><option>B-</option>
<option>AB+</option><option>AB-</option>
<option>O+</option><option>O-</option>
</select>

<label data-en="State" data-ta="மாநிலம்">State</label>
<select id="state" required>
<option value="">Select State</option>
<option>Tamil Nadu</option>
<option>Kerala</option>
<option>Karnataka</option>
<option>Andhra Pradesh</option>
<option>Telangana</option>
<option>Maharashtra</option>
<option>Delhi</option>
<option>Gujarat</option>
<option>Rajasthan</option>
<option>Uttar Pradesh</option>
<option>West Bengal</option>
<option>Punjab</option>
<option>Haryana</option>
<option>Bihar</option>
<option>Odisha</option>
<option>Assam</option>
<option>Goa</option>
<option>Jharkhand</option>
<option>Chhattisgarh</option>
<option>Madhya Pradesh</option>
<option>Himachal Pradesh</option>
<option>Uttarakhand</option>
<option>Manipur</option>
<option>Meghalaya</option>
<option>Mizoram</option>
<option>Nagaland</option>
<option>Tripura</option>
<option>Sikkim</option>
</select>

<label data-en="City" data-ta="நகரம்">City</label>
<input id="city" type="text" placeholder="Example: Coimbatore" required>

<button class="search-btn" type="submit"
data-en="Search Available Donors"
data-ta="கிடைக்கும் நன்கொடையாளர்களைத் தேடு">
Search Available Donors
</button>

</form>

<div id="results" class="results"></div>

<div class="note"
data-en="Prototype only: Use fictional contact information. Do not expose real donor details publicly. Donor consent and secure access controls are necessary for a real service. Search results are not medical compatibility confirmation."
data-ta="மாதிரி தளம் மட்டுமே: கற்பனையான தொடர்பு விவரங்களைப் பயன்படுத்தவும். உண்மையான நன்கொடையாளர் விவரங்களைப் பொதுவில் வெளியிட வேண்டாம். உண்மையான சேவைக்கு ஒப்புதல் மற்றும் பாதுகாப்பான அணுகல் கட்டுப்பாடுகள் அவசியம். தேடல் முடிவுகள் மருத்துவப் பொருத்தத்தை உறுதிப்படுத்தாது.">
Prototype only: Use fictional contact information.
</div>

</div>
</main>

<footer>BloodBridge © 2026</footer>

<script>
let language=localStorage.getItem("bloodbridgeLanguage")||"en";

function setLanguage(lang){
language=lang;
document.documentElement.lang=lang;

document.querySelectorAll("[data-en]").forEach(el=>{
el.textContent=el.getAttribute("data-"+lang);
});

document.getElementById("languageButton").textContent=
lang==="en"?"தமிழ்":"English";

localStorage.setItem("bloodbridgeLanguage",lang);
}

function toggleLanguage(){
setLanguage(language==="en"?"ta":"en");
}

function normalize(value){
return String(value||"").trim().toLowerCase();
}

function escapeHTML(value){
return String(value??"").replace(/[&<>"']/g,char=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
})[char]);
}

document.getElementById("searchForm").addEventListener("submit",function(e){

e.preventDefault();

const group=document.getElementById("bloodGroup").value;
const state=document.getElementById("state").value;
const city=document.getElementById("city").value;

const donors=JSON.parse(
localStorage.getItem("bloodbridgeDonors")||"[]"
);

const matches=donors.filter(donor=>
normalize(donor.bloodGroup)===normalize(group)&&
normalize(donor.state)===normalize(state)&&
normalize(donor.city)===normalize(city)&&
normalize(donor.availability)==="available"
);

const results=document.getElementById("results");

if(matches.length===0){
results.innerHTML=`
<div class="empty">
<strong>${language==="en"?"No available donor found!":"கிடைக்கும் நன்கொடையாளர் எவரும் இல்லை!"}</strong>
<p>${language==="en"?"Check your search details and try again.":"தேடல் விவரங்களைச் சரிபார்த்து மீண்டும் முயற்சிக்கவும்."}</p>
</div>`;
return;
}

results.innerHTML=`
<h2 style="color:#a50025;margin-bottom:15px">
${language==="en"?"Potential Donor Matches":"பொருந்தக்கூடிய நன்கொடையாளர்கள்"} (${matches.length})
</h2>

${matches.map(donor=>{

const phone=String(donor.phone||"").trim();
const email=String(donor.email||"").trim();

const validPhone=/^[0-9+()\-\s]{7,20}$/.test(phone);
const validEmail=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

return `
<div class="donor-card">

<h3>🩸 ${escapeHTML(donor.name||"Demo Donor")}</h3>

<div class="detail">
<strong>${language==="en"?"Age Group:":"வயது பிரிவு:"}</strong>
${escapeHTML(donor.ageGroup||"Not provided")}
</div>

<div class="detail">
<strong>${language==="en"?"Blood Group:":"இரத்த வகை:"}</strong>
${escapeHTML(donor.bloodGroup)}
</div>

<div class="detail">
<strong>${language==="en"?"Location:":"இருப்பிடம்:"}</strong>
${escapeHTML(donor.city)}, ${escapeHTML(donor.state)}
</div>

<div class="detail available">
● ${language==="en"?"Available":"கிடைக்கிறது"}
</div>

<div class="detail">
<strong>${language==="en"?"Phone:":"தொலைபேசி:"}</strong>
${escapeHTML(phone||"Not provided")}
</div>

<div class="detail">
<strong>${language==="en"?"Email:":"மின்னஞ்சல்:"}</strong>
${escapeHTML(email||"Not provided")}
</div>

<div class="contact">
${validPhone?`<a href="tel:${encodeURIComponent(phone)}">${language==="en"?"Call":"அழைக்க"}</a>`:""}
${validEmail?`<a href="mailto:${encodeURIComponent(email)}">${language==="en"?"Email":"மின்னஞ்சல்"}</a>`:""}
</div>

</div>`;

}).join("")}`;

});

setLanguage(language);
</script>

</body>
 </html>
