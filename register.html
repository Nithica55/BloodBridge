<!DOCTYPE html>
<html>
<head>
    <title>Become a Donor - BloodBridge</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🩸 BloodBridge</h1>
    <p>Become a Blood Donor</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="register.html">Become a Donor</a>
    <a href="search.html">Find Donor</a>
    <a href="request.html">Emergency Request</a>
</nav>

<section class="form-section">

    <h2>Donor Registration</h2>

    <form>

        <label>Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Blood Group</label>
        <select>
            <option>Select Blood Group</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>O+</option>
            <option>O-</option>
            <option>AB+</option>
            <option>AB-</option>
        </select>

        <label>City</label>
        <input type="text" placeholder="Enter your city">

        <label>Area</label>
        <input type="text" placeholder="Enter your area">

        <label>Availability</label>
        <select>
            <option>Available</option>
            <option>Not Available</option>
        </select>

        <button type="submit">Register as Donor</button>

    </form>

</section>

</body>
  </html>
