    <title>Become a Donor - BloodBridge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🩸 BloodBridge</h1>
    <p>Connecting blood donors with people in need</p>
</header>


<nav>
    <a href="index.html">Home</a>
    <a href="register.html">Become a Donor</a>
    <a href="search.html">Find Donor</a>
    <a href="request.html">Emergency Request</a>
</nav>


<section class="form-section">

    <h2>🩸 Donor Registration</h2>

    <p class="form-intro">
        Register as a potential blood donor and help someone in need.
    </p>


    <form id="donorForm">

        <!-- NAME -->

        <label for="name">Full Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required>


        <!-- BLOOD GROUP -->

        <label for="bloodGroup">Blood Group</label>

        <select id="bloodGroup" required>

            <option value="">Select Blood Group</option>

            <option value="A+">A+</option>
            <option value="A-">A-</option>

            <option value="B+">B+</option>
            <option value="B-">B-</option>

            <option value="O+">O+</option>
            <option value="O-">O-</option>

            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>

        </select>


        <!-- STATE -->

        <label for="state">State / Union Territory</label>

        <select id="state" required>

            <option value="">Select State / UT</option>

            <option>Andhra Pradesh</option>
            <option>Arunachal Pradesh</option>
            <option>Assam</option>
            <option>Bihar</option>
            <option>Chhattisgarh</option>
            <option>Goa</option>
            <option>Gujarat</option>
            <option>Haryana</option>
            <option>Himachal Pradesh</option>
            <option>Jharkhand</option>
            <option>Karnataka</option>
            <option>Kerala</option>
            <option>Madhya Pradesh</option>
            <option>Maharashtra</option>
            <option>Manipur</option>
            <option>Meghalaya</option>
            <option>Mizoram</option>
            <option>Nagaland</option>
            <option>Odisha</option>
            <option>Punjab</option>
            <option>Rajasthan</option>
            <option>Sikkim</option>
            <option>Tamil Nadu</option>
            <option>Telangana</option>
            <option>Tripura</option>
            <option>Uttar Pradesh</option>
            <option>Uttarakhand</option>
            <option>West Bengal</option>

            <option>Andaman and Nicobar Islands</option>
            <option>Chandigarh</option>
            <option>Dadra and Nagar Haveli and Daman and Diu</option>
            <option>Delhi</option>
            <option>Jammu and Kashmir</option>
            <option>Ladakh</option>
            <option>Lakshadweep</option>
            <option>Puducherry</option>

        </select>


        <!-- CITY -->

        <label for="city">City</label>

        <select id="city" required>

            <option value="">Select State First</option>

        </select>


        <!-- AREA -->

        <label for="area">Area / Locality</label>

        <input
            type="text"
            id="area"
            placeholder="Enter your area / locality"
            required>


        <!-- PHONE -->

        <label for="phone">Phone Number</label>

        <input
            type="tel"
            id="phone"
            placeholder="10-digit mobile number"
            maxlength="10"
            pattern="[0-9]{10}"
            required>


        <!-- EMAIL -->

        <label for="email">Email ID</label>

        <input
            type="email"
            id="email"
            placeholder="example@email.com"
            required>


        <!-- AVAILABILITY -->

        <label for="availability">Donation Availability</label>

        <select id="availability" required>

            <option value="">Select Availability</option>

            <option>Available</option>

            <option>Not Available</option>

        </select>


        <!-- SUBMIT -->

        <button type="submit">
            Register as Donor
        </button>

    </form>

</section>

/* -----------------------------------------
   STATE → CITY DROPDOWN
----------------------------------------- */

const stateSelect = document.getElementById("state");

const citySelect = document.getElementById("city");


stateSelect.addEventListener("change", function () {

    const selectedState = this.value;

    citySelect.innerHTML =
        '<option value="">Select City</option>';


    if (cities[selectedState]) {

        cities[selectedState].forEach(function(city) {

            const option =
                document.createElement("option");

            option.value = city;

            option.textContent = city;

            citySelect.appendChild(option);

        });

    }

});

----------------------------------------- */

document

.addEventListener("submit", function(event) {
