<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Become a Donor | BloodBridge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🩸 BloodBridge</h1>
    <p>Connecting blood donors with people in need</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="register.html">Become a Donor</a>
    <a href="search.html">Find Donor</a>
    <a href="request.html">Emergency Request</a>
</nav>

<section class="form-section">

    <h2>🩸 Become a Blood Donor</h2>

    <p>
        Register your details to help people find potential donors
        in their area.
    </p>

    <form id="donorForm">

        <label>Full Name</label>
        <input type="text" id="name" required>

        <label>Blood Group</label>

        <select id="bloodGroup" required>
            <option value="">Select Blood Group</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>O+</option>
            <option>O-</option>
            <option>AB+</option>
            <option>AB-</option>
        </select>

        <label>State / Union Territory</label>

        <select id="state" required>
            <option value="">Select State</option>

            <option>Tamil Nadu</option>
            <option>Kerala</option>
            <option>Karnataka</option>
            <option>Andhra Pradesh</option>
            <option>Telangana</option>
            <option>Maharashtra</option>
            <option>Delhi</option>
            <option>West Bengal</option>
            <option>Gujarat</option>
            <option>Rajasthan</option>
            <option>Uttar Pradesh</option>
            <option>Bihar</option>
            <option>Odisha</option>
            <option>Punjab</option>
            <option>Haryana</option>
            <option>Jharkhand</option>
            <option>Assam</option>
            <option>Goa</option>
        </select>

        <label>City</label>

        <select id="city" required>
            <option value="">Select City</option>
        </select>

        <label>Area / Locality</label>

        <input type="text" id="area" required>

        <label>Phone Number</label>

        <input
            type="tel"
            id="phone"
            maxlength="10"
            pattern="[0-9]{10}"
            required
        >

        <label>Email ID</label>

        <input type="email" id="email" required>

        <label>Donation Availability</label>

        <select id="availability" required>

            <option value="">
                Select Availability
            </option>

            <option>Available</option>

            <option>Not Available</option>

        </select>

        <button type="submit">
            Register as Donor
        </button>

    </form>

</section>

<footer>
    <p>© 2026 BloodBridge</p>
</footer>


<script>

const cities = {

    "Tamil Nadu": [
        "Chennai",
        "Coimbatore",
        "Madurai",
        "Tiruchirappalli",
        "Salem",
        "Tirunelveli",
        "Nagercoil",
        "Thoothukudi",
        "Erode",
        "Tiruppur",
        "Vellore",
        "Dindigul",
        "Thanjavur"
    ],

    "Kerala": [
        "Thiruvananthapuram",
        "Kochi",
        "Kozhikode",
        "Thrissur",
        "Kollam",
        "Alappuzha"
    ],

    "Karnataka": [
        "Bengaluru",
        "Mysuru",
        "Mangaluru",
        "Hubballi",
        "Belagavi"
    ],

    "Andhra Pradesh": [
        "Visakhapatnam",
        "Vijayawada",
        "Guntur",
        "Nellore",
        "Kurnool"
    ],

    "Telangana": [
        "Hyderabad",
        "Warangal",
        "Nizamabad",
        "Karimnagar"
    ],

    "Maharashtra": [
        "Mumbai",
        "Pune",
        "Nagpur",
        "Nashik",
        "Aurangabad"
    ],

    "Delhi": [
        "New Delhi"
    ],

    "West Bengal": [
        "Kolkata",
        "Howrah",
        "Durgapur",
        "Siliguri"
    ],

    "Gujarat": [
        "Ahmedabad",
        "Surat",
        "Vadodara",
        "Rajkot"
    ],

    "Rajasthan": [
        "Jaipur",
        "Jodhpur",
        "Udaipur",
        "Kota"
    ],

    "Uttar Pradesh": [
        "Lucknow",
        "Kanpur",
        "Agra",
        "Varanasi",
        "Noida"
    ],

    "Bihar": [
        "Patna",
        "Gaya",
        "Muzaffarpur"
    ],

    "Odisha": [
        "Bhubaneswar",
        "Cuttack",
        "Rourkela"
    ],

    "Punjab": [
        "Amritsar",
        "Ludhiana",
        "Jalandhar",
        "Patiala"
    ],

    "Haryana": [
        "Gurugram",
        "Faridabad",
        "Panipat",
        "Ambala"
    ],

    "Jharkhand": [
        "Ranchi",
        "Jamshedpur",
        "Dhanbad"
    ],

    "Assam": [
        "Guwahati",
        "Dibrugarh",
        "Silchar"
    ],

    "Goa": [
        "Panaji",
        "Margao"
    ]
};


// State → City

const stateSelect = document.getElementById("state");

const citySelect = document.getElementById("city");


stateSelect.addEventListener("change", function () {

    const selectedState = this.value;

    citySelect.innerHTML =
        '<option value="">Select City</option>';

    if (cities[selectedState]) {

        cities[selectedState].forEach(function(city) {

            const option =
                document.createElement("option");

            option.value = city;

            option.textContent = city;

            citySelect.appendChild(option);

        });

    }

});


// SAVE DONOR

document.getElementById("donorForm")
.addEventListener("submit", function(event) {

    event.preventDefault();


    const donor = {

        id: Date.now(),

        name: document.getElementById("name").value,

        bloodGroup:
            document.getElementById("bloodGroup").value,

        state:
            document.getElementById("state").value,

        city:
            document.getElementById("city").value,

        area:
            document.getElementById("area").value,

        phone:
            document.getElementById("phone").value,

        email:
            document.getElementById("email").value,

        availability:
            document.getElementById("availability").value

    };


    // Get existing donors

    let donors =
        JSON.parse(localStorage.getItem("bloodbridgeDonors"))
        || [];


    // Add new donor

    donors.push(donor);


    // Save donors

    localStorage.setItem(
        "bloodbridgeDonors",
        JSON.stringify(donors)
    );


    alert(
        "🎉 Donor registered successfully!"
    );


    this.reset();

});

</script>

</body>
</html>
