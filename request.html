<!DOCTYPE html>
<html>
<head>
    <title>Emergency Request - BloodBridge</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🩸 BloodBridge</h1>
    <p>Emergency Blood Request</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="register.html">Become a Donor</a>
    <a href="search.html">Find Donor</a>
    <a href="request.html">Emergency Request</a>
</nav>

<section class="form-section">

    <h2>Emergency Blood Request</h2>

    <form>

        <label>Required Blood Group</label>

        <select>
            <option>Select Blood Group</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>O+</option>
            <option>O-</option>
            <option>AB+</option>
            <option>AB-</option>
        </select>

        <label>Hospital / Location</label>

        <input
            type="text"
            placeholder="Enter hospital or location">

        <label>Urgency</label>

        <select>
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
        </select>

        <button type="submit">
            Submit Emergency Request
        </button>

    </form>

</section>

</body>
</html>
