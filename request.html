<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emergency Request | BloodBridge</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <h1>🩸 BloodBridge</h1>

    <p>Emergency Blood Request</p>

</header>



<nav>

    <a href="index.html">Home</a>

    <a href="register.html">Become a Donor</a>

    <a href="search.html">Find Donor</a>

    <a href="request.html">Emergency Request</a>

</nav>



<section class="form-section">

    <h2>🚨 Emergency Blood Request</h2>

    <p>
        Submit a request to find potential available
        blood donors near the required location.
    </p>


    <form id="requestForm">


        <!-- Patient Name -->

        <label>Patient / Request Name</label>

        <input
            type="text"
            id="patientName"
            placeholder="Enter name"
            required
        >



        <!-- Blood Group -->

        <label>Required Blood Group</label>

        <select id="requestBloodGroup" required>

            <option value="">
                Select Blood Group
            </option>

            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>O+</option>
            <option>O-</option>
            <option>AB+</option>
            <option>AB-</option>

        </select>



        <!-- State -->

        <label>State</label>

        <select id="requestState" required>

            <option value="">
                Select State
            </option>

            <option>Tamil Nadu</option>
            <option>Kerala</option>
            <option>Karnataka</option>
            <option>Andhra Pradesh</option>
            <option>Telangana</option>
            <option>Maharashtra</option>
            <option>Delhi</option>
            <option>West Bengal</option>
            <option>Gujarat</option>
            <option>Rajasthan</option>
            <option>Uttar Pradesh</option>
            <option>Bihar</option>
            <option>Odisha</option>
            <option>Punjab</option>
            <option>Haryana</option>
            <option>Jharkhand</option>
            <option>Assam</option>
            <option>Goa</option>

        </select>



        <!-- City -->

        <label>City</label>

        <input
            type="text"
            id="requestCity"
            placeholder="Enter city"
            required
        >



        <!-- Hospital -->

        <label>Hospital Name</label>

        <input
            type="text"
            id="hospital"
            placeholder="Enter hospital name"
            required
        >



        <!-- Units -->

        <label>Required Units</label>

        <input
            type="number"
            id="units"
            min="1"
            max="20"
            placeholder="Example: 2"
            required
        >



        <!-- Urgency -->

        <label>Urgency Level</label>

        <select id="urgency" required>

            <option value="">
                Select Urgency
            </option>

            <option value="Critical">
                🔴 Critical - Immediate
            </option>

            <option value="Urgent">
                🟠 Urgent - Within a few hours
            </option>

            <option value="Normal">
                🟢 Normal - Planned requirement
            </option>

        </select>



        <!-- Contact -->

        <label>Contact Number</label>

        <input
            type="tel"
            id="contact"
            maxlength="10"
            pattern="[0-9]{10}"
            placeholder="10-digit number"
            required
        >



        <!-- Submit -->

        <button type="submit">
            🚨 Submit Emergency Request
        </button>


    </form>

</section>



<footer>

    <p>
        © 2026 BloodBridge
    </p>

</footer>



<script>


document.getElementById("requestForm")
.addEventListener("submit", function(event) {

    event.preventDefault();



    // Create request object

    const request = {

        id: Date.now(),

        patientName:
            document.getElementById("patientName").value,

        bloodGroup:
            document.getElementById("requestBloodGroup").value,

        state:
            document.getElementById("requestState").value,

        city:
            document.getElementById("requestCity").value,

        hospital:
            document.getElementById("hospital").value,

        units:
            document.getElementById("units").value,

        urgency:
            document.getElementById("urgency").value,

        contact:
            document.getElementById("contact").value,

        createdAt:
            new Date().toLocaleString()

    };



    // Get existing requests

    let requests =
        JSON.parse(
            localStorage.getItem(
                "bloodbridgeRequests"
            )
        ) || [];



    // Add new request

    requests.push(request);



    // Save request

    localStorage.setItem(
        "bloodbridgeRequests",
        JSON.stringify(requests)
    );



    alert(
        "🚨 Emergency blood request submitted successfully!"
    );



    // Clear form

    this.reset();


});

</script>


</body>

    </html>
