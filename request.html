<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Request - BloodBridge</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🩸 BloodBridge</h1>
    <p>Emergency Blood Request System</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="register.html">Become a Donor</a>
    <a href="search.html">Find Donor</a>
    <a href="request.html">Emergency Request</a>
    <a href="matching.html">Smart Matching</a>
    <a href="dashboard.html">Dashboard</a>
</nav>

<section class="form-section">

    <h2>🚨 Emergency Blood Request</h2>

    <p>Submit your blood requirement to find potential donors.</p>

    <form id="requestForm">

        <label>Patient / Request Name</label>
        <input type="text" id="patientName" required>

        <label>Required Blood Group</label>
        <select id="bloodGroup" required>
            <option value="">Select Blood Group</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>O+</option>
            <option>O-</option>
            <option>AB+</option>
            <option>AB-</option>
        </select>

        <label>State</label>
        <input type="text" id="state"
               placeholder="Example: Tamil Nadu" required>

        <label>City</label>
        <input type="text" id="city"
               placeholder="Example: Coimbatore" required>

        <label>Hospital Name</label>
        <input type="text" id="hospital" required>

        <label>Required Units</label>
        <input type="number" id="units"
               min="1" max="20" required>

        <label>Urgency</label>
        <select id="urgency" required>
            <option value="">Select Urgency</option>
            <option>Critical</option>
            <option>Urgent</option>
            <option>Normal</option>
        </select>

        <label>Contact Number</label>
        <input type="tel" id="phone"
               pattern="[0-9]{10}"
               maxlength="10"
               placeholder="10-digit number" required>

        <button type="submit">
            🚨 Submit Emergency Request
        </button>

    </form>

    <div id="result"></div>

</section>

<footer>
    <p>© 2026 BloodBridge</p>
</footer>

<script>

function clean(value) {
    return String(value || "").trim().toLowerCase();
}

document.getElementById("requestForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const request = {
        id: Date.now(),
        patientName: document.getElementById("patientName").value.trim(),
        bloodGroup: document.getElementById("bloodGroup").value,
        state: document.getElementById("state").value.trim(),
        city: document.getElementById("city").value.trim(),
        hospital: document.getElementById("hospital").value.trim(),
        units: document.getElementById("units").value,
        urgency: document.getElementById("urgency").value,
        phone: document.getElementById("phone").value.trim(),
        date: new Date().toLocaleString()
    };

    // Save emergency request

    let requests = JSON.parse(
        localStorage.getItem("bloodbridgeRequests")
    ) || [];

    requests.push(request);

    localStorage.setItem(
        "bloodbridgeRequests",
        JSON.stringify(requests)
    );

    // Get registered donors

    const donors = JSON.parse(
        localStorage.getItem("bloodbridgeDonors")
    ) || [];

    // Find potential matches

    const matches = donors.filter(function(donor) {

        return (
            clean(donor.bloodGroup) === clean(request.bloodGroup) &&
            clean(donor.state) === clean(request.state) &&
            clean(donor.city) === clean(request.city) &&
            clean(donor.availability) === "available"
        );

    });

    const result = document.getElementById("result");

    if (matches.length > 0) {

        alert(
            "🩸 POTENTIAL DONOR MATCH FOUND!\n\n" +
            matches.length +
            " available donor(s) found in " +
            request.city + "."
        );

        result.innerHTML = `
            <div class="card">
                <h3>🩸 Potential Matches Found!</h3>
                <p>${matches.length} available donor(s) found.</p>
                <p>Blood Group: ${request.bloodGroup}</p>
                <p>Location: ${request.city}, ${request.state}</p>
                <p>Your request has been saved successfully.</p>
            </div>
        `;

    } else {

        alert(
            "⚠️ NO MATCH FOUND\n\n" +
            "Your emergency request has been saved. " +
            "No available potential donor was found " +
            "in the selected location."
        );

        result.innerHTML = `
            <div class="card">
                <h3>⚠️ No Potential Match Found</h3>
                <p>Your emergency request has been saved.</p>
                <p>Try checking nearby locations or contact a hospital blood bank.</p>
            </div>
        `;

    }

    this.reset();

});

</script>

</body>
    </html>
