h1{

.form-group{

input,

.role-buttons{

<script type="module">

import {
    db,
    collection,
    addDoc,
    serverTimestamp,
    getDocs
} from "./firebase.js";



/* ================================================= */
/* ================= LANGUAGE ======================= */
/* ================================================= */

let currentLanguage =
    localStorage.getItem("bloodbridgeLanguage") || "en";


function setLanguage(language){

    currentLanguage = language;

    document.documentElement.lang = language;


    /* Change all normal text */

    document
        .querySelectorAll("[data-en][data-ta]")
        .forEach(element => {

            const translatedText =
                language === "ta"
                ? element.getAttribute("data-ta")
                : element.getAttribute("data-en");

            element.textContent =
                translatedText;

        });



    /* Change placeholders */

    document
        .querySelectorAll("[data-en-placeholder][data-ta-placeholder]")
        .forEach(element => {

            element.placeholder =
                language === "ta"
                ? element.getAttribute("data-ta-placeholder")
                : element.getAttribute("data-en-placeholder");

        });



    /* Change language button */

    document.getElementById(
        "languageButton"
    ).textContent =
        language === "en"
        ? "தமிழ்"
        : "English";


    localStorage.setItem(
        "bloodbridgeLanguage",
        language
    );

}



/* ================= TOGGLE LANGUAGE ================= */

window.toggleLanguage = function(){

    if(currentLanguage === "en"){

        setLanguage("ta");

    }else{

        setLanguage("en");

    }

};



/* ================================================= */
/* ================= SECTION SWITCH ================= */
/* ================================================= */

window.showSection = function(section){

    document
        .getElementById("loginSection")
        .classList.remove("active");

    document
        .getElementById("registerSection")
        .classList.remove("active");


    document
        .getElementById("loginTab")
        .classList.remove("active");

    document
        .getElementById("registerTab")
        .classList.remove("active");



    if(section === "login"){

        document
            .getElementById("loginSection")
            .classList.add("active");

        document
            .getElementById("loginTab")
            .classList.add("active");

    }

    else{

        document
            .getElementById("registerSection")
            .classList.add("active");

        document
            .getElementById("registerTab")
            .classList.add("active");

    }



    /*
     IMPORTANT:
     Apply the current language again
     whenever Login/Register is opened.
    */

    setLanguage(currentLanguage);

};



/* ================================================= */
/* ================= LOGIN ROLE ===================== */
/* ================================================= */

let loginRole = "donor";


window.selectLoginRole = function(role){

    loginRole = role;


    document
        .querySelectorAll("#loginSection .role-btn")
        .forEach(button => {

            button.classList.remove("active");

        });


    const selected =
        document.querySelector(
            `#loginSection .role-btn[data-role="${role}"]`
        );


    if(selected){

        selected.classList.add("active");

    }

};



/* ================================================= */
/* ================ REGISTER ROLE =================== */
/* ================================================= */

let registerRole = "donor";


window.selectRegisterRole = function(role){

    registerRole = role;


    document
        .querySelectorAll(
            "#registerSection .role-btn"
        )
        .forEach(button => {

            button.classList.remove("active");

        });


    const selected =
        document.querySelector(
            `#registerSection .role-btn[data-register-role="${role}"]`
        );


    if(selected){

        selected.classList.add("active");

    }


    document
        .getElementById("donorFields")
        .classList.remove("active");

    document
        .getElementById("requesterFields")
        .classList.remove("active");

    document
        .getElementById("adminFields")
        .classList.remove("active");


    if(role === "donor"){

        document
            .getElementById("donorFields")
            .classList.add("active");

    }

    else if(role === "requester"){

        document
            .getElementById("requesterFields")
            .classList.add("active");

    }

    else if(role === "admin"){

        document
            .getElementById("adminFields")
            .classList.add("active");

    }


    /* Re-apply language */

    setLanguage(currentLanguage);

};



/* ================================================= */
/* ================= MESSAGE ======================== */
/* ================================================= */

function showMessage(
    element,
    english,
    tamil,
    type
){
