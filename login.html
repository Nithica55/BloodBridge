body{

header{

h1,h2{

    font-weight:bold;
}

.tab.active{

    color:white;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

.form-group{

}

label{

}

input,select{

}

input:focus,select:focus{

.role-buttons{

    gap:8px;

.role-btn{

    border-radius:20px;

.role-btn.active{

.main-btn{

    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.main-btn:hover{

}

.message{

    border-radius:8px;

}

.success{

}

.error{

}

.role-section{
    display:none;
}

.role-section.active{

}

.note{

    color:#666;

.checkbox-row{

.checkbox-row input{

@media(max-width:600px){

<!-- ================= FIREBASE ================= -->

<script type="module">

import {
    db,
    collection,
    addDoc,
    serverTimestamp,
    getDocs
} from "./firebase.js";


/* ================= LANGUAGE ================= */

let currentLanguage =
    localStorage.getItem("bloodbridgeLanguage") || "en";


function setLanguage(language){

    currentLanguage = language;

    document.documentElement.lang = language;


    /* Text */

    document.querySelectorAll("[data-en]").forEach(element => {

        const text =
            element.getAttribute("data-" + language);

        if(text !== null){
            element.textContent = text;
        }

    });


    /* Placeholders */

    document.querySelectorAll("[data-en-placeholder]").forEach(element => {

        const placeholder =
            element.getAttribute(
                "data-" + language + "-placeholder"
            );

        if(placeholder !== null){
            element.placeholder = placeholder;
        }

    });


    /* Button */

    const languageButton =
        document.getElementById("languageButton");

    if(languageButton){

        languageButton.textContent =
            language === "en"
            ? "தமிழ்"
            : "English";

    }


    localStorage.setItem(
        "bloodbridgeLanguage",
        language
    );

}


window.toggleLanguage = function(){

    const newLanguage =
        currentLanguage === "en"
        ? "ta"
        : "en";

    setLanguage(newLanguage);

};


function translated(en,ta){

    return currentLanguage === "en"
        ? en
        : ta;

}


/* ================= LOGIN ROLE ================= */

let loginRole = "donor";


window.selectLoginRole = function(role){

    loginRole = role;

    document
        .querySelectorAll("#loginSection .role-btn")
        .forEach(button => {

            button.classList.remove("active");

        });

    const selected =
        document.querySelector(
            `#loginSection .role-btn[data-role="${role}"]`
        );

    if(selected){
        selected.classList.add("active");
    }

};



/* ================= REGISTER ROLE ================= */

let registerRole = "donor";


window.selectRegisterRole = function(role){

    registerRole = role;


    document
        .querySelectorAll("#registerSection .role-btn")
        .forEach(button => {

            button.classList.remove("active");

        });


    const selected =
        document.querySelector(
            `#registerSection .role-btn[data-register-role="${role}"]`
        );

    if(selected){
        selected.classList.add("active");
    }


    document
        .getElementById("donorFields")
        .classList.remove("active");

    document
        .getElementById("requesterFields")
        .classList.remove("active");

    document
        .getElementById("adminFields")
        .classList.remove("active");


    if(role === "donor"){

        document
            .getElementById("donorFields")
            .classList.add("active");

    }

    if(role === "requester"){

        document
            .getElementById("requesterFields")
            .classList.add("active");

    }

    if(role === "admin"){

        document
            .getElementById("adminFields")
            .classList.add("active");

    }

};



/* ================= TABS ================= */

window.showSection = function(section){

    document
        .getElementById("loginSection")
        .classList.remove("active");

    document
        .getElementById("registerSection")
        .classList.remove("active");

    document
        .getElementById("loginTab")
        .classList.remove("active");

    document
        .getElementById("registerTab")
        .classList.remove("active");


    if(section === "login"){

        document
            .getElementById("loginSection")
            .classList.add("active");

        document
            .getElementById("loginTab")
            .classList.add("active");

    }else{

        document
            .getElementById("registerSection")
            .classList.add("active");

        document
            .getElementById("registerTab")
            .classList.add("active");

    }

};



/* ================= LOGIN ================= */

window.loginUser = async function(){

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value
            .trim();


    const message =
        document.getElementById("loginMessage");


    message.style.display = "block";


    if(!email || !password){

        message.className =
            "message error";

        message.textContent =
            translated(
                "Please enter email and password.",
                "மின்னஞ்சல் மற்றும் கடவுச்சொல்லை உள்ளிடவும்."
            );

        return;

    }


    /* Demo accounts */

    const demoAccounts = {

        "donor@bloodbridge.demo":{
            password:"donor123",
            role:"donor"
        },

        "requester@bloodbridge.demo":{
            password:"request123",
            role:"requester"
        },

        "admin@bloodbridge.demo":{
            password:"admin123",
            role:"admin"
        }

    };


    if(
        demoAccounts[email] &&
        demoAccounts[email].password === password
    ){

        if(
            demoAccounts[email].role !== loginRole
        ){

            message.className =
                "message error";

            message.textContent =
                translated(
                    "Please select the correct login role.",
                    "சரியான உள்நுழைவு வகையைத் தேர்ந்தெடுக்கவும்."
                );

            return;

        }


        localStorage.setItem(
            "bloodbridgeLoggedIn",
            "true"
        );

        localStorage.setItem(
            "bloodbridgeUserRole",
            loginRole
        );

        localStorage.setItem(
            "bloodbridgeUserEmail",
            email
        );


        message.className =
            "message success";

        message.textContent =
            translated(
                "Login successful. Redirecting...",
                "உள்நுழைவு வெற்றிகரமாக முடிந்தது. மாற்றப்படுகிறது..."
            );


        setTimeout(() => {

            window.location.href =
                "profile.html";

        },800);

        return;

    }



    /* Firebase users */

    try{

        let foundUser = false;

        const collectionName =
            loginRole === "donor"
            ? "donors"
            : loginRole === "requester"
            ? "requesters"
            : "admins";


        const snapshot =
            await getDocs(
                collection(db,collectionName)
            );


        snapshot.forEach(doc => {

            const data = doc.data();


            if(
                data.email === email &&
                data.password === password
            ){

                foundUser = true;

            }

        });


        if(foundUser){

            localStorage.setItem(
                "bloodbridgeLoggedIn",
                "true"
            );

            localStorage.setItem(
                "bloodbridgeUserRole",
                loginRole
