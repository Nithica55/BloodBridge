<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BloodBridge | Login & Registration</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#fff5f5,#ffe4e6);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
}

.card{
    background:white;
    border-radius:18px;
    padding:28px;
    box-shadow:0 10px 35px rgba(0,0,0,0.15);
}

.logo{
    text-align:center;
    color:#c1121f;
    font-size:30px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:20px;
}

.language-btn{
    display:block;
    margin:0 auto 20px;
    background:#c1121f;
    color:white;
    border:none;
    padding:9px 18px;
    border-radius:20px;
    cursor:pointer;
    font-size:14px;
}

.tabs{
    display:flex;
    margin-bottom:20px;
    border-bottom:2px solid #eee;
}

.tab{
    flex:1;
    padding:13px;
    border:none;
    background:none;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    color:#777;
}

.tab.active{
    color:#c1121f;
    border-bottom:3px solid #c1121f;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

.role-buttons{
    display:flex;
    gap:8px;
    margin-bottom:18px;
}

.role-btn{
    flex:1;
    padding:10px 5px;
    border:1px solid #ddd;
    background:#fff;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
}

.role-btn.active{
    background:#c1121f;
    color:white;
    border-color:#c1121f;
}

label{
    display:block;
    font-weight:bold;
    margin:12px 0 6px;
    color:#333;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:14px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#c1121f;
}

button.main-btn{
    width:100%;
    margin-top:20px;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#c1121f;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button.main-btn:hover{
    background:#a30f1a;
}

.message{
    margin-top:15px;
    padding:10px;
    border-radius:7px;
    text-align:center;
    display:none;
}

.success{
    display:block;
    background:#e8f7e8;
    color:#197019;
}

.error{
    display:block;
    background:#ffe8e8;
    color:#a00000;
}

.small-text{
    text-align:center;
    color:#777;
    font-size:12px;
    margin-top:15px;
}

.hidden{
    display:none !important;
}

.checkbox-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:15px;
}

.checkbox-row input{
    width:auto;
}

.checkbox-row label{
    margin:0;
    font-weight:normal;
}

@media(max-width:450px){
    .card{
        padding:20px;
    }

    .role-btn{
        font-size:12px;
    }
}
</style>
</head>

<script type="module">

import {
    db,
    collection,
    addDoc,
    serverTimestamp
} from "./firebase.js";


/* ================= LANGUAGE ================= */

let currentLanguage =
    localStorage.getItem("bloodbridgeLanguage") || "en";


function setLanguage(language){

    currentLanguage = language;

    document.documentElement.lang = language;

    /* TEXT */

    document.querySelectorAll("[data-en]").forEach(element => {

        const text =
            element.getAttribute("data-" + language);

        if(text){
            element.textContent = text;
        }

    });


    /* PLACEHOLDERS */

    document.querySelectorAll("[data-placeholder-en]").forEach(element => {

        const placeholder =
            element.getAttribute(
                "data-placeholder-" + language
            );

        if(placeholder){
            element.placeholder = placeholder;
        }

    });


    /* LANGUAGE BUTTON */

    const languageButton =
        document.getElementById("languageButton");

    languageButton.textContent =
        language === "en" ? "தமிழ்" : "English";


    localStorage.setItem(
        "bloodbridgeLanguage",
        language
    );
}


window.toggleLanguage = function(){

    const newLanguage =
        currentLanguage === "en"
        ? "ta"
        : "en";

    setLanguage(newLanguage);

};


/* ================= TAB SWITCH ================= */

window.showSection = function(section){

    document
        .getElementById("loginSection")
        .classList.remove("active");

    document
        .getElementById("registerSection")
        .classList.remove("active");

    document
        .getElementById("loginTab")
        .classList.remove("active");

    document
        .getElementById("registerTab")
        .classList.remove("active");


    if(section === "login"){

        document
            .getElementById("loginSection")
            .classList.add("active");

        document
            .getElementById("loginTab")
            .classList.add("active");

    }

    else{

        document
            .getElementById("registerSection")
            .classList.add("active");

        document
            .getElementById("registerTab")
            .classList.add("active");

    }


    /* FIX: language stays applied after switching tabs */

    setLanguage(currentLanguage);

};


/* ================= LOGIN ROLE ================= */

let loginRole = "donor";


window.selectLoginRole = function(role, button){

    loginRole = role;

    document
        .querySelectorAll("#loginSection .role-btn")
        .forEach(btn => {
            btn.classList.remove("active");
        });

    button.classList.add("active");

};


/* ================= REGISTER ROLE ================= */

let registerRole = "donor";


window.selectRegisterRole = function(role, button){

    registerRole = role;


    document
        .querySelectorAll("#registerSection .role-btn")
        .forEach(btn => {
            btn.classList.remove("active");
        });

    button.classList.add("active");


    document
        .getElementById("donorFields")
        .classList.add("hidden");

    document
        .getElementById("requesterFields")
        .classList.add("hidden");

    document
        .getElementById("adminFields")
        .classList.add("hidden");


    if(role === "donor"){

        document
            .getElementById("donorFields")
            .classList.remove("hidden");

    }

    else if(role === "requester"){

        document
            .getElementById("requesterFields")
            .classList.remove("hidden");

    }

    else if(role === "admin"){

        document
            .getElementById("adminFields")
            .classList.remove("hidden");

    }

};


/* ================= MESSAGE ================= */

function showMessage(element, message, type){

    element.textContent = message;

    element.className =
        "message " + type;

}


/* ================= LOGIN ================= */

window.loginUser = function(){

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value
            .trim();

    const message =
        document.getElementById("loginMessage");


    if(!email || !password){

        showMessage(
            message,
            currentLanguage === "en"
                ? "Please enter email and password."
                : "மின்னஞ்சல் மற்றும் கடவுச்சொல்லை உள்ளிடவும்.",
            "error"
        );

        return;

    }


    /* DEMO LOGIN */

    let valid = false;

    if(
        loginRole === "donor" &&
        email === "donor@bloodbridge.demo" &&
        password === "donor123"
    ){
        valid = true;
    }

    else if(
        loginRole === "requester" &&
        email === "requester@bloodbridge.demo" &&
        password === "request123"
    ){
        valid = true;
    }

    else if(
        loginRole === "admin" &&
        email === "admin@bloodbridge.demo" &&
        password === "admin123"
    ){
        valid = true;
    }


    if(valid){

        localStorage.setItem(
            "bloodbridgeLoggedIn",
            "true"
        );

        localStorage.setItem(
            "bloodbridgeUserRole",
            loginRole
        );

        localStorage.setItem(
            "bloodbridgeUserEmail",
            email
        );


        showMessage(
            message,
            currentLanguage === "en"
                ? "Login successful! Redirecting..."
                : "உள்நுழைவு வெற்றிகரமாக முடிந்தது! மாற்றப்படுகிறது...",
            "success"
        );


        setTimeout(() => {

            window.location.href =
                "profile.html";

        },1000);

    }

    else{

        showMessage(
            message,
            currentLanguage === "en"
                ? "Invalid login details."
                : "தவறான உள்நுழைவு விவரங்கள்.",
            "error"
        );

    }

};


/* ================= REGISTER ================= */

window.registerUser = async function(){

    const message =
        document.getElementById("registerMessage");


    const name =
        document
            .getElementById("regName")
            .value
            .trim();

    const email =
        document
            .getElementById("regEmail")
            .value
            .trim();

    const phone =
        document
            .getElementById("regPhone")
            .value
            .trim();

    const password =
        document
            .getElementById("regPassword")
            .value
            .trim();


    /* BASIC VALIDATION */

    if(!name || !email || !phone || !password){

        showMessage(
            message,
            currentLanguage === "en"
                ? "Please fill all required fields."
                : "தேவையான அனைத்து விவரங்களையும் நிரப்பவும்.",
            "error"
        );

        return;

    }


    if(password.length < 6){

        showMessage(
            message,
            currentLanguage === "en"
                ? "Password must contain at least 6 characters."
                : "கடவுச்சொல்லில் குறைந்தது 6 எழுத்துகள் இருக்க வேண்டும்.",
            "error"
        );

        return;

    }


    try{

        let collectionName = "";

        let userData = {

            name:name,
            email:email,
            phone:phone,
            role:registerRole,
            createdAt:serverTimestamp()

        };


        /* ================= DONOR ================= */

        if(registerRole === "donor"){

            const ageGroup =
                document
                    .getElementById("regAgeGroup")
                    .value;

            const bloodGroup =
                document
                    .getElementById("regBloodGroup")
                    .value;

            const state =
                document
                    .getElementById("regState")
                    .value;

            const city =
                document
                    .getElementById("regCity")
                    .value
                    .trim();

            const availability =
                document
                    .getElementById("regAvailability")
                    .value;

            const contactConsent =
                document
                    .getElementById("contactConsent")
                    .checked;


            if(
                !ageGroup ||
                !bloodGroup ||
                !state ||
                !city ||
                !availability
            ){

                showMessage(
                    message,
                    currentLanguage === "en"
                        ? "Please complete all donor details."
                        : "தானதாரர் விவரங்கள் அனைத்தையும் நிரப்பவும்.",
                    "error"
                );

                return;

            }


            collectionName
