<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BloodBridge | Login & Registration</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#fff5f5,#ffe5e8);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:500px;
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.15);
}

.logo{
    text-align:center;
    color:#c1121f;
    font-size:30px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:15px;
}

.language{
    display:block;
    margin:0 auto 20px;
    background:#c1121f;
    color:white;
    border:none;
    border-radius:20px;
    padding:9px 18px;
    cursor:pointer;
}

.tabs{
    display:flex;
    width:100%;
    margin-bottom:20px;
}

.tab{
    width:50%;
    padding:13px;
    border:none;
    background:#eee;
    color:#555;
    font-weight:bold;
    cursor:pointer;
    font-size:16px;
}

.tab.active{
    background:#c1121f;
    color:white;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

.roles{
    display:flex;
    gap:8px;
    margin:15px 0;
}

.role{
    flex:1;
    padding:11px 5px;
    border:1px solid #ccc;
    border-radius:8px;
    background:white;
    cursor:pointer;
    font-weight:bold;
}

.role.active{
    background:#c1121f;
    color:white;
    border-color:#c1121f;
}

label{
    display:block;
    margin:12px 0 5px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:14px;
}

.main-btn{
    width:100%;
    padding:13px;
    margin-top:20px;
    border:none;
    border-radius:8px;
    background:#c1121f;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.main-btn:hover{
    background:#a50e19;
}

.hidden{
    display:none !important;
}

.message{
    margin-top:15px;
    padding:10px;
    border-radius:7px;
    text-align:center;
}

.success{
    background:#e7f7e7;
    color:#176b17;
}

.error{
    background:#ffe7e7;
    color:#a00000;
}

.check{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:15px;
}

.check input{
    width:auto;
}

.check label{
    margin:0;
    font-weight:normal;
}

</style>

</head>

<body>

<div class="card">

<div class="logo">
🩸 BloodBridge
</div>

<p class="subtitle"
data-en="Connect blood donors with people in need"
data-ta="இரத்த தானதாரர்களையும் இரத்தம் தேவைப்படுபவர்களையும் இணைக்கவும்">
Connect blood donors with people in need
</p>


<button
class="language"
id="languageButton"
onclick="toggleLanguage()">
தமிழ்
</button>


<!-- ================= TABS ================= -->

<div class="tabs">

<button
id="loginTab"
class="tab active"
onclick="showPage('login')"
data-en="Login"
data-ta="உள்நுழைவு">
Login
</button>

<button
id="registerTab"
class="tab"
onclick="showPage('register')"
data-en="Register"
data-ta="பதிவு செய்யவும்">
Register
</button>

</div>


<!-- ================= LOGIN ================= -->

<div id="loginPage" class="section active">

<h2
data-en="Login"
data-ta="உள்நுழைவு">
Login
</h2>


<div class="roles">

<button
class="role active"
onclick="chooseLoginRole('donor',this)"
data-en="Donor"
data-ta="தானதாரர்">
Donor
</button>

<button
class="role"
onclick="chooseLoginRole('requester',this)"
data-en="Requester"
data-ta="கோருபவர்">
Requester
</button>

<button
class="role"
onclick="chooseLoginRole('admin',this)"
data-en="Admin"
data-ta="நிர்வாகி">
Admin
</button>

</div>


<label
data-en="Email ID"
data-ta="மின்னஞ்சல் முகவரி">
Email ID
</label>

<input
id="loginEmail"
type="email"
placeholder="Enter email">


<label
data-en="Password"
data-ta="கடவுச்சொல்">
Password
</label>

<input
id="loginPassword"
type="password"
placeholder="Enter password">


<button
class="main-btn"
onclick="loginUser()"
data-en="Login"
data-ta="உள்நுழைய">
Login
</button>

<div id="loginMessage"></div>

</div>


<!-- ================= REGISTER ================= -->

<div id="registerPage" class="section">

<h2
data-en="Create Account"
data-ta="கணக்கை உருவாக்கவும்">
Create Account
</h2>


<div class="roles">

<button
class="role active"
onclick="chooseRegisterRole('donor',this)"
data-en="Donor"
data-ta="தானதாரர்">
Donor
</button>

<button
class="role"
onclick="chooseRegisterRole('requester',this)"
data-en="Requester"
data-ta="கோருபவர்">
Requester
</button>

<button
class="role"
onclick="chooseRegisterRole('admin',this)"
data-en="Admin"
data-ta="நிர்வாகி">
Admin
</button>

</div>


<!-- COMMON -->

<label
data-en="Full Name"
data-ta="முழு பெயர்">
Full Name
</label>

<input
id="regName"
type="text"
placeholder="Enter full name">


<label
data-en="Email ID"
data-ta="மின்னஞ்சல் முகவரி">
Email ID
</label>

<input
id="regEmail"
type="email"
placeholder="Enter email">


<label
data-en="Phone Number"
data-ta="தொலைபேசி எண்">
Phone Number
</label>

<input
id="regPhone"
type="tel"
placeholder="Enter phone number">


<!-- DONOR -->

<div id="donorFields">

<label
data-en="Age Group"
data-ta="வயது பிரிவு">
Age Group
</label>

<select id="regAgeGroup">

<option value="">Select age group</option>
<option value="18-25">18-25</option>
<option value="26-35">26-35</option>
<option value="36-45">36-45</option>
<option value="46-55">46-55</option>
<option value="56+">56+</option>

</select>


<label
data-en="Blood Group"
data-ta="இரத்த வகை">
Blood Group
</label>

<select id="regBloodGroup">

<option value="">Select blood group</option>

<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>

</select>


<label
data-en="State"
data-ta="மாநிலம்">
State
</label>

<select id="regState">

<option value="">Select state</option>
<option>Tamil Nadu</option>
<option>Kerala</option>
<option>Karnataka</option>
<option>Andhra Pradesh</option>
<option>Telangana</option>
<option>Maharashtra</option>
<option>Delhi</option>
<option>Other</option>

</select>


<label
data-en="City"
data-ta="நகரம்">
City
</label>

<input
id="regCity"
type="text"
placeholder="Enter city">


<label
data-en="Availability"
data-ta="கிடைக்கும் நிலை">
Availability
</label>

<select id="regAvailability">

<option value="">Select availability</option>
<option value="Available">Available</option>
<option value="Not Available">Not Available</option>

</select>


<div class="check">

<input
type="checkbox"
id="contactConsent">

<label
for="contactConsent"
data-en="Allow people to contact me"
data-ta="மற்றவர்கள் என்னை தொடர்பு கொள்ள அனுமதிக்கவும்">
Allow people to contact me
</label>

</div>

</div>


<!-- REQUESTER -->

<div id="requesterFields" class="hidden">

<label
data-en="State"
data-ta="மாநிலம்">
State
</label>

<select id="reqState">

<option value="">Select state</option>
<option>Tamil Nadu</option>
<option>Kerala</option>
<option>Karnataka</option>
<option>Andhra Pradesh</option>
<option>Telangana</option>
<option>Maharashtra</option>
<option>Delhi</option>
<option>Other</option>

</select>


<label
data-en="City"
data-ta="நகரம்">
City
</label>

<input
id="reqCity"
type="text"
placeholder="Enter city">


<label
data-en="Hospital / Medical Centre"
data-ta="மருத்துவமனை / மருத்துவ மையம்">
Hospital / Medical Centre
</label>

<input
id="reqHospital"
type="text"
placeholder="Enter hospital name">

</div>


<!-- ADMIN -->

<div id="adminFields" class="hidden">

<label
data-en="Admin ID"
data-ta="நிர்வாகி ID">
Admin ID
</label>

<input
id="adminId"
type="text"
placeholder="Enter admin ID">

</div>


<!-- PASSWORD -->

<label
data-en="Password"
data-ta="கடவுச்சொல்">
Password
</label>

<input
id="regPassword"
type="password"
placeholder="Create password">


<button
class="main-btn"
onclick="registerUser()"
data-en="Create Account"
data-ta="கணக்கை உருவாக்கவும்">
Create Account
</button>


<div id="registerMessage"></div>

</div>

</div>


<script type="module">

import {
    db,
    collection,
    addDoc,
    serverTimestamp
} from "./firebase.js";


/* LANGUAGE */

let language =
localStorage.getItem("bloodbridgeLanguage") || "en";


function applyLanguage(){

    document
    .querySelectorAll("[data-en]")
    .forEach(el => {

        const value =
        el.getAttribute(
            "data-" + language
        );

        if(value){
            el.textContent = value;
        }

    });


    document.getElementById(
        "languageButton"
    ).textContent =
    language === "en"
    ? "தமிழ்"
    : "English";

}


window.toggleLanguage = function(){

    language =
    language === "en"
    ? "ta"
    : "en";

    localStorage.setItem(
        "bloodbridgeLanguage",
        language
    );

    applyLanguage();

};


/* PAGE SWITCH */

window.showPage = function(page){

    const login =
    document.getElementById(
        "loginPage"
    );

    const register =
    document.getElementById(
        "registerPage"
    );

    const loginTab =
    document.getElementById(
        "loginTab"
    );

    const registerTab =
    document.getElementById(
        "registerTab"
    );


    login.classList.remove("active");
    register.classList.remove("active");

    loginTab.classList.remove("active");
    registerTab.classList.remove("active");


    if(page === "login"){

        login.classList.add("active");
        loginTab.classList.add("active");

    }

    else{

        register.classList.add("active");
        registerTab.classList.add("active");

    }


    applyLanguage();

};


/* LOGIN ROLE */

let loginRole = "donor";


window.chooseLoginRole =
function(role,button){

    loginRole = role;


    document
    .querySelectorAll(
        "#loginPage .role"
    )
    .forEach(btn => {

        btn.classList.remove(
            "active"
        );

    });


    button.classList.add(
        "active"
    );

};


/* REGISTER ROLE */

let registerRole = "donor";


window.chooseRegisterRole =
function(role,button){

    registerRole = role;


    document
    .querySelectorAll(
        "#registerPage .role"
    )
    .forEach(btn => {

        btn.classList.remove(
            "active"
        );

    });


    button.classList.add(
        "active"
    );


    document
    .getElementById(
        "donorFields"
    )
    .classList.add("hidden");


    document
    .getElementById(
        "requesterFields"
    )
    .classList.add("hidden");


    document
    .getElementById(
        "adminFields"
    )
    .classList.add("hidden");


    if(role === "donor"){

        document
        .getElementById(
            "donorFields"
        )
        .classList.remove(
            "hidden"
        );

    }

    else if(role === "requester"){

        document
        .getElementById(
            "requesterFields"
        )
        .classList.remove(
            "hidden"
        );

    }

    else{

        document
        .getElementById(
            "adminFields"
        )
        .classList.remove(
            "hidden"
        );

    }

};


/* LOGIN */

window.loginUser =
function(){

    const email =
    document.getElementById(
        "loginEmail"
    ).value.trim();

    const password =
    document.getElementById(
        "loginPassword"
    ).value.trim();

    const message =
    document.getElementById(
        "loginMessage"
    );


    if(!email || !password){

        message.className =
        "message error";

        message.textContent =
        language === "en"
        ? "Please enter email and password."
        : "மின்னஞ்சல் மற்றும் கடவுச்சொல்லை உள்ளிடவும்.";

        return;

    }


    let valid = false;


    if(
        loginRole === "donor" &&
        email === "donor@bloodbridge.demo" &&
        password === "donor123"
    ){

        valid = true;

    }


    if(
        loginRole === "requester" &&
        email === "requester@bloodbridge.demo" &&
        password === "request123"
    ){

        valid = true;

    }


    if(
        loginRole === "admin" &&
        email === "admin@bloodbridge.demo" &&
        password === "admin123"
    ){

        valid = true;

    }


    if(valid){

        localStorage.setItem(
            "bloodbridgeLoggedIn",
            "true"
        );

        localStorage.setItem(
            "bloodbridgeUserRole",
            loginRole
        );

        localStorage.setItem(
            "bloodbridgeUserEmail",
            email
        );


        message.className =
        "message success";

        message.textContent =
        language === "en"
        ? "Login successful!"
        : "உள்நுழைவு வெற்றிகரமாக முடிந்தது!";


        setTimeout(() => {

            window.location.href =
            "profile.html";

        },1000);

    }

    else{

        message.className =
        "message error";

        message.textContent =
        language === "en"
        ? "Invalid login details."
        : "தவறான உள்நுழைவு விவரங்கள்.";

    }

};


/* REGISTER */

window.registerUser =
async function(){

    const message =
    document.getElementById(
        "registerMessage"
    );


    const name =
    document.getElementById(
        "regName"
    ).value.trim();

    const email =
    document.getElementById(
        "regEmail"
    ).value.trim();

    const phone =
    document.getElementById(
        "regPhone"
    ).value.trim();

    const password =
    document.getElementById(
        "regPassword"
    ).value.trim();


    if(
        !name ||
        !email ||
        !phone ||
        !password
    ){

        message.className =
        "message error";

        message.textContent =
        language === "en"
        ? "Please fill all required fields."
        : "தேவையான அனைத்து விவரங்களையும் நிரப்பவும்.";

        return;

    }


    try{

        let data = {

            name:name,
            email:email,
            phone:phone,
            role:registerRole,
            createdAt:serverTimestamp()

        };


        let collectionName;


        if(registerRole === "donor"){

            collectionName =
            "donors";

            data.ageGroup =
            document.getElementById(
                "regAgeGroup"
            ).value;

            data.bloodGroup =
            document.getElementById(
                "regBloodGroup"
            ).value;

            data.state =
            document.getElementById(
                "regState"
            ).value;

            data.city =
            document.getElementById(
                "regCity"
            ).value.trim();

            data.availability =
            document.getElementById(
                "regAvailability"
            ).value;

            data.contactConsent =
            document.getElementById(
                "contactConsent"
            ).checked;

        }


        else if(registerRole === "requester"){

            collectionName =
            "requesters";

            data.state =
            document.getElementById(
                "reqState"
            ).value;

            data.city =
            document.getElementById(
                "reqCity"
            ).value.trim();

            data.hospital =
            document.getElementById(
                "reqHospital"
            ).value.trim();

        }


        else{

            collectionName =
            "admins";

            data.adminId =
            document.getElementById(
                "adminId"
            ).value.trim();

        }


        await addDoc(
            collection(
                db,
                collectionName
            ),
            data
        );


        localStorage.setItem(
            "bloodbridgeLoggedIn",
            "true"
        );

        localStorage.setItem(
            "bloodbridgeUserRole",
            registerRole
        );

        localStorage.setItem(
            "bloodbridgeUserEmail",
            email
        );


        message.className =
        "message success";

        message.textContent =
        language === "en"
        ? "Account created successfully!"
        : "கணக்கு வெற்றிகரமாக உருவாக்கப்பட்டது!";


        setTimeout(() => {

            window.location.href =
            "profile.html";

        },1000);

    }


    catch(error){

        console.error(
            error
        );

        message.className =
        "message error";

        message.textContent =
        "Registration failed: "
        + error.message;

    }

};


applyLanguage();

</script>

</body>
    </html>
