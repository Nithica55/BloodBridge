<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BloodBridge | Login & Registration</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #fff5f5, #f8f9fa);
    padding: 25px 15px;
}

.container {
    width: 100%;
    max-width: 480px;
    margin: auto;
}

.logo {
    text-align: center;
    margin-bottom: 20px;
}

.logo-icon {
    width: 70px;
    height: 70px;
    margin: auto;
    border-radius: 50%;
    background: #b71c1c;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
}

.logo h1 {
    color: #b71c1c;
    margin-top: 10px;
}

.logo p {
    color: #777;
    font-size: 14px;
    margin-top: 5px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 22px;
    box-shadow: 0 10px 35px rgba(0,0,0,.12);
}

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
}

.tab {
    flex: 1;
    padding: 12px;
    border: 1px solid #ddd;
    background: white;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}

.tab.active {
    background: #b71c1c;
    color: white;
    border-color: #b71c1c;
}

h2 {
    text-align: center;
    color: #8e0000;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #777;
    font-size: 13px;
    margin-bottom: 20px;
}

label {
    display: block;
    margin: 13px 0 6px;
    font-size: 13px;
    font-weight: bold;
    color: #444;
}

input,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 9px;
    font-size: 14px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #b71c1c;
}

.role-box {
    display: flex;
    gap: 8px;
    margin: 15px 0;
}

.role-box button {
    flex: 1;
    padding: 10px 5px;
    border: 1px solid #ddd;
    background: white;
    border-radius: 9px;
    cursor: pointer;
}

.role-box button.active {
    background: #ffebee;
    border-color: #b71c1c;
    color: #b71c1c;
    font-weight: bold;
}

.hidden {
    display: none;
}

.main-btn {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg,#b71c1c,#e53935);
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.message {
    display: none;
    margin-top: 15px;
    padding: 12px;
    border-radius: 9px;
    text-align: center;
    font-size: 13px;
}

.success {
    display: block;
    background: #e8f5e9;
    color: #2e7d32;
}

.error {
    display: block;
    background: #ffebee;
    color: #c62828;
}

.consent {
    margin-top: 15px;
    display: flex;
    gap: 8px;
    align-items: flex-start;
    font-size: 12px;
    color: #555;
}

.consent input {
    width: auto;
    margin-top: 2px;
}

.demo {
    margin-top: 20px;
    padding: 12px;
    border-radius: 10px;
    background: #fafafa;
    font-size: 11px;
    color: #666;
}

.language-box {
    text-align: right;
    margin-bottom: 15px;
}

.language-box button {
    padding: 8px 15px;
    border: 1px solid #b71c1c;
    background: white;
    color: #b71c1c;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

@media(max-width:480px) {
    .card {
        padding: 20px;
    }
}

</style>

</head>

<body>

<div class="container">

<div class="logo">

    <div class="logo-icon">🩸</div>

    <h1>BloodBridge</h1>

    <p
    data-en="Connecting donors with those in need"
    data-ta="இரத்த தானம் செய்பவர்களையும் தேவைப்படுபவர்களையும் இணைக்கிறது">
        Connecting donors with those in need
    </p>

</div>


<div class="card">

<!-- LANGUAGE -->

<div class="language-box">

<button
id="languageButton"
onclick="toggleLanguage()">
தமிழ்
</button>

</div>


<!-- TABS -->

<div class="tabs">

<button
class="tab active"
id="loginTab"
onclick="showLogin()"
data-en="Login"
data-ta="உள்நுழைவு">
Login
</button>

<button
class="tab"
id="registerTab"
onclick="showRegister()"
data-en="Register"
data-ta="பதிவு செய்க">
Register
</button>

</div>


<!-- ================= LOGIN ================= -->

<div id="loginSection">

<h2
data-en="Welcome Back"
data-ta="மீண்டும் வரவேற்கிறோம்">
Welcome Back
</h2>

<p
class="subtitle"
data-en="Login to continue to BloodBridge"
data-ta="BloodBridge-ஐத் தொடர உள்நுழையவும்">
Login to continue to BloodBridge
</p>


<label
data-en="Email ID"
data-ta="மின்னஞ்சல் முகவரி">
Email ID
</label>

<input
type="email"
id="loginEmail"
placeholder="Enter email"
data-en-placeholder="Enter email"
data-ta-placeholder="மின்னஞ்சலை உள்ளிடவும்">


<label
data-en="Password"
data-ta="கடவுச்சொல்">
Password
</label>

<input
type="password"
id="loginPassword"
placeholder="Enter password"
data-en-placeholder="Enter password"
data-ta-placeholder="கடவுச்சொல்லை உள்ளிடவும்">


<label
data-en="Login As"
data-ta="எந்த வகையில் உள்நுழைகிறீர்கள்">
Login As
</label>

<select id="loginRole">

<option
value="donor"
data-en="Donor"
data-ta="நன்கொடையாளர்">
Donor
</option>

<option
value="requester"
data-en="Requester"
data-ta="கோரிக்கையாளர்">
Requester
</option>

<option
value="admin"
data-en="Admin"
data-ta="நிர்வாகி">
Admin
</option>

</select>


<button
class="main-btn"
onclick="loginUser()"
data-en="Login"
data-ta="உள்நுழைக">
Login
</button>

</div>


<!-- ================= REGISTER ================= -->

<div id="registerSection" class="hidden">

<h2
data-en="Create Account"
data-ta="கணக்கை உருவாக்குங்கள்">
Create Account
</h2>

<p
class="subtitle"
data-en="Register according to your BloodBridge role"
data-ta="உங்கள் BloodBridge பங்கைத் தேர்ந்தெடுத்து பதிவு செய்யுங்கள்">
Register according to your BloodBridge role
</p>


<div class="role-box">

<button
id="donorBtn"
class="active"
onclick="selectRole('donor')"
data-en="🩸 Donor"
data-ta="🩸 நன்கொடையாளர்">
🩸 Donor
</button>

<button
id="requesterBtn"
onclick="selectRole('requester')"
data-en="🚨 Requester"
data-ta="🚨 கோரிக்கையாளர்">
🚨 Requester
</button>

<button
id="adminBtn"
onclick="selectRole('admin')"
data-en="🛡️ Admin"
data-ta="🛡️ நிர்வாகி">
🛡️ Admin
</button>

</div>


<!-- COMMON -->

<label
data-en="Name"
data-ta="பெயர்">
Name
</label>

<input
type="text"
id="name"
placeholder="Enter your name"
data-en-placeholder="Enter your name"
data
