<script type="module">

import {
    db,
    collection,
    addDoc,
    serverTimestamp
} from "./firebase.js";


/* ================= LANGUAGE ================= */

let currentLanguage =
    localStorage.getItem("bloodbridgeLanguage") || "en";


function setLanguage(language) {

    currentLanguage = language;

    document.documentElement.lang = language;

    document.querySelectorAll("[data-en]").forEach(element => {

        const value =
            element.getAttribute("data-" + language);

        if (value !== null) {
            element.textContent = value;
        }

    });

    document.querySelectorAll("[data-placeholder-en]").forEach(element => {

        const value =
            element.getAttribute(
                "data-placeholder-" + language
            );

        if (value !== null) {
            element.placeholder = value;
        }

    });

    const languageButton =
        document.getElementById("languageButton");

    if (languageButton) {
        languageButton.textContent =
            language === "en"
                ? "தமிழ்"
                : "English";
    }

    localStorage.setItem(
        "bloodbridgeLanguage",
        language
    );
}


window.toggleLanguage = function () {

    setLanguage(
        currentLanguage === "en"
            ? "ta"
            : "en"
    );

};


/* ================= TAB SWITCH ================= */

window.showSection = function(section) {

    const loginSection =
        document.getElementById("loginSection");

    const registerSection =
        document.getElementById("registerSection");

    const loginTab =
        document.getElementById("loginTab");

    const registerTab =
        document.getElementById("registerTab");


    loginSection.classList.remove("active");
    registerSection.classList.remove("active");

    loginTab.classList.remove("active");
    registerTab.classList.remove("active");


    if (section === "login") {

        loginSection.classList.add("active");
        loginTab.classList.add("active");

    } else {

        registerSection.classList.add("active");
        registerTab.classList.add("active");

    }


    setLanguage(currentLanguage);
};


/* ================= LOGIN ROLE ================= */

let loginRole = "donor";


window.selectLoginRole = function(role, button) {

    loginRole = role;

    const buttons =
        document.querySelectorAll(
            "#loginSection .role-btn"
        );

    buttons.forEach(btn => {
        btn.classList.remove("active");
    });

    button.classList.add("active");

    console.log("Login role selected:", loginRole);
};


/* ================= REGISTER ROLE ================= */

let registerRole = "donor";


window.selectRegisterRole = function(role, button) {

    registerRole = role;

    const buttons =
        document.querySelectorAll(
            "#registerSection .role-btn"
        );

    buttons.forEach(btn => {
        btn.classList.remove("active");
    });

    button.classList.add("active");


    const donorFields =
        document.getElementById("donorFields");

    const requesterFields =
        document.getElementById("requesterFields");

    const adminFields =
        document.getElementById("adminFields");


    donorFields.classList.add("hidden");
    requesterFields.classList.add("hidden");
    adminFields.classList.add("hidden");


    if (role === "donor") {

        donorFields.classList.remove("hidden");

    }

    else if (role === "requester") {

        requesterFields.classList.remove("hidden");

    }

    else if (role === "admin") {

        adminFields.classList.remove("hidden");

    }

};


/* ================= MESSAGE ================= */

function showMessage(element, message, type) {

    element.textContent = message;

    element.className =
        "message " + type;

}


/* ================= LOGIN ================= */

window.loginUser = function() {

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value
            .trim();

    const message =
        document.getElementById("loginMessage");


    if (!email || !password) {

        showMessage(
            message,
            currentLanguage === "en"
                ? "Please enter email and password."
                : "மின்னஞ்சல் மற்றும் கடவுச்சொல்லை உள்ளிடவும்.",
            "error"
        );

        return;
    }


    let valid = false;


    if (
        loginRole === "donor" &&
        email === "donor@bloodbridge.demo" &&
        password === "donor123"
    ) {

        valid = true;

    }

    else if (
        loginRole === "requester" &&
        email === "requester@bloodbridge.demo" &&
        password === "request123"
    ) {

        valid = true;

    }

    else if (
        loginRole === "admin" &&
        email === "admin@bloodbridge.demo" &&
        password === "admin123"
    ) {

        valid = true;

    }


    if (valid) {

        localStorage.setItem(
            "bloodbridgeLoggedIn",
            "true"
        );

        localStorage.setItem(
            "bloodbridgeUserRole",
            loginRole
        );

        localStorage.setItem(
            "bloodbridgeUserEmail",
            email
        );


        showMessage(
            message,
            currentLanguage === "en"
                ? "Login successful!"
                : "உள்நுழைவு வெற்றிகரமாக முடிந்தது!",
            "success"
        );


        setTimeout(() => {

            window.location.href =
                "profile.html";

        }, 1000);

    }

    else {

        showMessage(
            message,
            currentLanguage === "en"
                ? "Invalid login details."
                : "தவறான உள்நுழைவு விவரங்கள்.",
            "error"
        );

    }

};


/* ================= START ================= */

setLanguage(currentLanguage);


/* Make Donor selected when page opens */

const firstLoginButton =
    document.querySelector(
        "#loginSection .role-btn"
    );

if (firstLoginButton) {
    selectLoginRole(
        "donor",
        firstLoginButton
    );
}


const firstRegisterButton =
    document.querySelector(
        "#registerSection .role-btn"
    );

if (firstRegisterButton) {
    selectRegisterRole(
        "donor",
        firstRegisterButton
    );
}

        </script>
